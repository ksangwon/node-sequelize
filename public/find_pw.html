{% extends 'base.html' %}

{% block content %}
<div class="signup-container">
    <h3>비밀번호 찾기</h3>
    <form action="{{ url_for('find_pw') }}" method="POST">
        <div class="form-group">
            <label>아이디</label>
            <input type="text" name="username" required placeholder="가입한 아이디">
        </div>
        <div class="form-group">
            <label>이름</label>
            <input type="text" name="name" required placeholder="가입 시 등록한 이름">
        </div>
        <div class="form-group">
            <label>이메일</label>
            <input type="email" name="email" required placeholder="가입 시 등록한 이메일">
        </div>
        <button type="submit" class="submit-btn">비밀번호 재설정</button>
        <div style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('login') }}" style="font-size: 0.9em; color: #555; text-decoration: none;">로그인으로 돌아가기</a>
        </div>
    </form>
</div>
{% endblock %}
